<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rewire｜重塑大腦的可能</title>
    <meta name="description" content="理解神經可塑性，重新練習思考、情緒與行為。以《Rewire》為核心的繁體中文互動式學習網站。" />
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B201D" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- 字體：Google Fonts（只下載字型檔，不傳送任何個人資料） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap"
    />
    <!-- 在 React 載入前先套用主題與字級，避免畫面閃爍 -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('rewire:v1') || '{}').settings || {};
          var dark = s.theme === 'dark' || (s.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.dataset.font = s.fontScale || 'md';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>此網站需要啟用 JavaScript 才能使用互動功能。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
