# 自動建置並部署到 GitHub Pages
# - 建置 rewire-app（React + Vite），輸出到 rewire/
# - 將整個網站（MINDY OS 作品集 + rewire/）一起部署
# 使用前請到 Settings → Pages → Build and deployment → Source 選擇「GitHub Actions」（只需設定一次）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rewire-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rewire-app/package-lock.json
      - run: npm ci
      - name: 程式碼檢查、型別檢查、單元測試
        run: npm run lint && npm run typecheck && npm test
      - name: 建置 Rewire（輸出到 ../rewire）
        run: npm run build
      - name: 組合要發布的網站檔案
        working-directory: .
        run: |
          mkdir -p _site
          rsync -a ./ _site/ --exclude .git --exclude .github --exclude rewire-app --exclude _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
